# Gayatri Kamdhenu Sevatirth — sevatirthbhorda.org
# Configuration reference: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Production D1: sevatirth-bhorda (OC). Apply migrations with: npm run db:migrate:remote
# See SETUP.md.

name = "sevatirth-bhorda"
main = "src/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SES_REGION = "ap-south-1"
SES_FROM_EMAIL = "noreply@sevatirthbhorda.org"

# Apex is the canonical host. www is bound so the Worker can 301 to apex.
[[routes]]
pattern = "sevatirthbhorda.org"
custom_domain = true

[[routes]]
pattern = "www.sevatirthbhorda.org"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sevatirth-bhorda"
database_id = "38e6a8df-65ea-4d2a-bad3-c962ca6dcc1a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sevatirth-bhorda-media"

[triggers]
crons = ["0 6 * * *"]

# Declared Worker secrets — set each with: wrangler secret put <NAME>
# Local values go in .env (see .env.example). Do not commit real values.
#
# Runtime requirements:
#   Required for admin OTP + reminder email: SUPERADMIN_PASSWORD, SES_ACCESS_KEY, SES_SECRET_KEY
#   Optional (graceful fallback when unset/placeholder): SENDY_URL, SENDY_LIST_ID, GA4_ID
[secrets]
required = [
	"SUPERADMIN_PASSWORD",
	"SES_ACCESS_KEY",
	"SES_SECRET_KEY",
	"SENDY_URL",
	"SENDY_LIST_ID",
	"GA4_ID",
]
